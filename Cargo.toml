# The app is the root package; xtask holds the repo's helper commands (`cargo xtask …`).
[workspace]
members = [".", "xtask"]

[package]
name = "guitarcraft"
# The one place the version lives. Change it with `cargo xtask version set X.Y.Z`; the app,
# the .exe's version info and the installer all read it from here.
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[[bin]]
name = "guitarcraft"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
cpal = "0.16"
midir = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_dock = { version = "0.21", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.21"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
# Icon + VERSIONINFO for guitarcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
# The About window's list of open-source components: read from Cargo.lock, stored compressed.
serde_json = "1"
flate2 = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console","Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }
